worker_processes auto;
pid /tmp/kgsumm-nginx.pid;
error_log stderr;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/kgsumm-nginx-access.log;
    client_body_temp_path /tmp/kgsumm-client-body;
    proxy_temp_path /tmp/kgsumm-proxy;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 100m;

        location / {
            proxy_pass http://127.0.0.1:8081;
            include proxy-common.conf;
        }

        location = /services/tot4es { return 308 /services/tot4es/; }
        location = /services/evaluation { return 308 /services/evaluation/; }
        location = /services/dataset { return 308 /services/dataset/; }

        location ^~ /services/tot4es/ {
            proxy_pass http://127.0.0.1:5000/;
            include proxy-common.conf;
            proxy_set_header X-Forwarded-Prefix /services/tot4es;
            proxy_redirect default;
            proxy_redirect ~^/(?!services/tot4es/)(.*)$ /services/tot4es/$1;
            proxy_cookie_path ~^/$ /services/tot4es/;
        }

        location ^~ /services/evaluation/ {
            proxy_pass http://127.0.0.1:8011/;
            include proxy-common.conf;
            proxy_set_header X-Forwarded-Prefix /services/evaluation;
            proxy_redirect default;
            proxy_redirect ~^/(?!services/evaluation/)(.*)$ /services/evaluation/$1;
            proxy_cookie_path ~^/$ /services/evaluation/;
        }

        location ^~ /services/dataset/ {
            proxy_pass http://127.0.0.1:8022/;
            include proxy-common.conf;
            proxy_set_header X-Forwarded-Prefix /services/dataset;
            proxy_redirect default;
            proxy_redirect ~^/(?!services/dataset/)(.*)$ /services/dataset/$1;
            proxy_cookie_path ~^/$ /services/dataset/;
        }
    }
}